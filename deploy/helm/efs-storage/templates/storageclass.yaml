{{- if .Values.storageClass.create }}
{{- if not .Values.efs.fileSystemId }}
{{- fail "efs.fileSystemId is required. Run deploy/performance/bootstrap-efs.sh to create the filesystem, then pass the ID (GitOps: annotation efs_file_system_id on the ArgoCD cluster Secret; Helm: --set efs.fileSystemId=fs-...)." }}
{{- end }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
provisioner: efs.csi.aws.com
reclaimPolicy: {{ .Values.storageClass.reclaimPolicy }}
volumeBindingMode: {{ .Values.storageClass.volumeBindingMode }}
parameters:
  provisioningMode: {{ .Values.storageClass.provisioningMode }}
  fileSystemId: {{ .Values.efs.fileSystemId }}
  directoryPerms: {{ .Values.storageClass.directoryPerms | quote }}
  gidRangeStart: {{ .Values.storageClass.gidRangeStart | quote }}
  gidRangeEnd: {{ .Values.storageClass.gidRangeEnd | quote }}
{{- end }}
