{{- if .Values.inferenceService.enabled }}
# ServiceAccount for the predictor pods.
#
# The secrets list is CONDITIONAL. This chart's predecessor listed a secret named
# hf-token unconditionally while creating no such Secret, so a default install
# produced a ServiceAccount referencing an object that did not exist, on top of a
# default storageUri pointing at a gated Hugging Face repository. Set
# model.tokenSecretName only after creating the Secret yourself; NOTES.txt spells
# out the command.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "neuron-serving.serviceAccountName" . }}
  namespace: {{ .Values.targetNamespace.name }}
  labels:
    {{- include "neuron-serving.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
{{- with .Values.model.tokenSecretName }}
secrets:
  - name: {{ . }}
{{- end }}
{{- end }}
