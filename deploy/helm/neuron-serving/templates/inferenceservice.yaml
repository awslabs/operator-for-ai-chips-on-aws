{{- if .Values.inferenceService.enabled }}
{{- if and (eq .Values.model.source "pvc") (not .Values.modelCache.enabled) (not .Values.modelCache.existingClaim) }}
{{- fail "model.source=pvc requires modelCache.enabled=true (or modelCache.existingClaim), otherwise there is no claim to read weights from." }}
{{- end }}
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ include "neuron-serving.inferenceServiceName" . }}
  namespace: {{ .Values.targetNamespace.name }}
  labels:
    opendatahub.io/dashboard: "true"
    {{- include "neuron-serving.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    # CRD comes from KServe, enabled by the DataScienceCluster that
    # deploy/helm/oai-platform applies in its own wave 2.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Knative gives up on a revision that does not become ready in time. A cold
    # start here is a model load plus a full Neuron compile, so this has to
    # exceed the ServingRuntime startup-probe budget.
    serving.knative.dev/progress-deadline: {{ .Values.inferenceService.progressDeadline | quote }}
spec:
  predictor:
    serviceAccountName: {{ include "neuron-serving.serviceAccountName" . }}
    minReplicas: {{ .Values.inferenceService.minReplicas }}
    maxReplicas: {{ .Values.inferenceService.maxReplicas }}
    model:
      modelFormat:
        name: {{ .Values.servingRuntime.modelFormat.name }}
      runtime: {{ include "neuron-serving.servingRuntimeName" . }}
      {{- if eq .Values.model.source "pvc" }}
      storageUri: {{ printf "pvc://%s" (include "neuron-serving.modelCacheClaim" .) | quote }}
      {{- else }}
      # Pulled from Hugging Face at startup. Gated repositories need a token: see
      # model.tokenSecretName and NOTES.txt.
      storageUri: {{ printf "hf://%s" .Values.model.name | quote }}
      {{- end }}
      resources:
        limits:
          aws.amazon.com/neuron: {{ .Values.inferenceService.neuronDevices | quote }}
          memory: {{ .Values.inferenceService.memoryLimit }}
        requests:
          aws.amazon.com/neuron: {{ .Values.inferenceService.neuronDevices | quote }}
          memory: {{ .Values.inferenceService.memoryRequest }}
{{- end }}
