{{- if .Values.openshiftAI.enabled }}
{{- if .Values.openshiftAI.createNamespace }}
# Red Hat OpenShift AI. Supplies the KServe, ServingRuntime and
# InferenceService CRDs that deploy/helm/neuron-serving renders against.
#
# Prune=false: redhat-ods-operator is where RHOAI itself lives. Deleting this
# namespace uninstalls OpenShift AI cluster-wide, which is not a reasonable
# consequence of removing one ArgoCD Application.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.openshiftAI.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false
---
{{- end }}
{{- if .Values.openshiftAI.createOperatorGroup }}
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ .Values.openshiftAI.namespace }}
  namespace: {{ .Values.openshiftAI.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false
spec: {}
---
{{- end }}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhods-operator
  namespace: {{ .Values.openshiftAI.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  channel: {{ .Values.openshiftAI.channel }}
  installPlanApproval: Automatic
  name: rhods-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
{{- end }}
