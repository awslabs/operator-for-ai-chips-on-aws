{{- if .Values.servingRuntime.enabled }}
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: {{ .Values.servingRuntime.name }}
  namespace: {{ .Values.servingNamespace }}
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # CRD comes from KServe, enabled by the DataScienceCluster in wave 2.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    opendatahub.io/recommended-accelerators: '["aws.amazon.com/neuron"]'
    openshift.io/display-name: "vLLM for AWS Neuron (EFS compile cache)"
    opendatahub.io/apiProtocol: REST
spec:
  annotations:
    sidecar.istio.io/inject: "true"
    serving.knative.openshift.io/enablePassthrough: "true"
  supportedModelFormats:
    - name: vllm-neuron
      version: "1"
      autoSelect: true
  containers:
    - name: kserve-container
      image: {{ .Values.servingRuntime.image }}
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - --port=8080
        - --model=/mnt/models
        - --served-model-name=$(MODEL_NAME)
        - --tensor-parallel-size={{ .Values.servingRuntime.tensorParallelSize }}
        - --max-num-seqs={{ .Values.servingRuntime.maxNumSeqs }}
        - --max-model-len={{ .Values.servingRuntime.maxModelLen }}
        - --block-size=16
        {{- if .Values.servingRuntime.enablePrefixCaching }}
        - --enable-prefix-caching
        {{- else }}
        - --no-enable-prefix-caching
        {{- end }}
        {{- if .Values.servingRuntime.enableChunkedPrefill }}
        - --enable-chunked-prefill
        {{- else }}
        - --no-enable-chunked-prefill
        {{- end }}
      env:
        - name: MODEL_NAME
          value: {{ .Values.model.name }}
        {{- if .Values.compileCache.enabled }}
        # The documented Neuron persistent cache location. Default without this
        # is /var/tmp/neuron-compile-cache inside the container, which is lost on
        # pod restart. NEURON_CC_FLAGS --cache_dir would override this if set.
        - name: NEURON_COMPILE_CACHE_URL
          value: {{ .Values.compileCache.mountPath | quote }}
        {{- end }}
        {{- with .Values.servingRuntime.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - containerPort: 8080
          protocol: TCP
      volumeMounts:
        - name: shm
          mountPath: /dev/shm
        {{- if .Values.compileCache.enabled }}
        - name: neuron-compile-cache
          mountPath: {{ .Values.compileCache.mountPath }}
        {{- end }}
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: {{ .Values.servingRuntime.probeInitialDelaySeconds }}
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: {{ .Values.servingRuntime.probeInitialDelaySeconds }}
        periodSeconds: 10
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: {{ .Values.servingRuntime.shmSize }}
    {{- if .Values.compileCache.enabled }}
    - name: neuron-compile-cache
      persistentVolumeClaim:
        claimName: {{ .Values.compileCache.name }}
    {{- end }}
{{- end }}
