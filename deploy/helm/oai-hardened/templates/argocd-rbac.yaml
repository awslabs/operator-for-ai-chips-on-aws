{{- if .Values.argocdRbac.create }}
# ArgoCD needs these cluster-scoped permissions to manage the RHOAI and KServe
# custom resources in this chart. Scoped deliberately, rather than binding the
# application controller to cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-oai-hardened
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups:
      - datasciencecluster.opendatahub.io
    resources:
      - datascienceclusters
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups:
      - serving.kserve.io
    resources:
      - servingruntimes
      - inferenceservices
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups:
      - operators.coreos.com
    resources:
      - subscriptions
      - operatorgroups
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-oai-hardened
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: {{ .Values.argocdRbac.serviceAccountName }}
    namespace: {{ .Values.argocdRbac.namespace }}
roleRef:
  kind: ClusterRole
  name: argocd-oai-hardened
  apiGroup: rbac.authorization.k8s.io
{{- end }}
