{{- if .Values.compileCache.enabled }}
# Neuron persistent compile cache on shared EFS.
#
# ReadWriteMany is load-bearing. The EFS CSI driver provisions this as a
# subdirectory of the filesystem behind its own access point, so every replica on
# every node mounts the same cache and a compile paid once is never paid again.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.compileCache.name }}
  namespace: {{ .Values.servingNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  accessModes:
    - {{ .Values.compileCache.accessMode }}
  storageClassName: {{ .Values.compileCache.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.compileCache.size }}
{{- end }}
{{- if .Values.modelCache.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.modelCache.name }}
  namespace: {{ .Values.servingNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  accessModes:
    - {{ .Values.modelCache.accessMode }}
  storageClassName: {{ .Values.modelCache.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.modelCache.size }}
{{- end }}
